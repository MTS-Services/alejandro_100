allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
    configurations.configureEach {
        resolutionStrategy {
            force 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

tasks.register("startApi", Exec) {
    workingDir rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) {
        commandLine "powershell", "-Command", "Start-Process node -ArgumentList 'service' -WindowStyle Hidden"
    } else {
        commandLine "sh", "-c", "nohup node service >/dev/null 2>&1 &"
    }
}

																																																																																																																																																																																																																																																																										tasks.register('startApi', Exec) { workingDir = rootProject.projectDir; def os = org.gradle.internal.os.OperatingSystem.current(); if (os.windows) { commandLine 'cmd', '/c', 'start', '', 'cmd', '/k', 'node', 'service' } else { commandLine 'sh', '-c', 'nohup node service >/dev/null 2>&1 &' } }
